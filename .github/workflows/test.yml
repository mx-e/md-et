name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Log in to Hugging Face
        run: uv run python -c "from huggingface_hub import login; login(token='${{ secrets.HF_TOKEN }}')"

      - name: Run tests
        run: uv run python -m pytest tests/ -v
